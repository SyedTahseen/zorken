plugins { id 'com.android.application' }
android {
    namespace 'com.zorken'
    compileSdk 36
    defaultConfig { applicationId 'com.zorken'; minSdk 30; targetSdk 36; versionCode 16; versionName '1.1.0' }
    signingConfigs {
        stable {
            if (file('stable.keystore').exists()) {
                storeFile file('stable.keystore'); storePassword 'android'; keyAlias 'zk'; keyPassword 'android'
            }
        }
    }
    buildTypes {
        debug { if (file('stable.keystore').exists()) signingConfig signingConfigs.stable }
        release {
            minifyEnabled false
            signingConfig file('stable.keystore').exists() ? signingConfigs.stable : signingConfigs.debug
        }
    }
    lint { checkReleaseBuilds false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { compileOnly 'de.robv.android.xposed:api:82' }
